<!-- Atmosphere Micro-interaction script -->
<script>
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;

            // Subtle parallax or shadow movement could go here
            // Keeping it minimal as per Fluent design principles
        });

        // Simple button click effect
        const btn = document.querySelector('button');
        btn.addEventListener('click', function(e) {
            let x = e.clientX - e.target.offsetLeft;
            let y = e.clientY - e.target.offsetTop;

            let ripple = document.createElement('span');
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            // Logic for ripple effect if desired, but Fluent prefers standard states
        });
    </script>
